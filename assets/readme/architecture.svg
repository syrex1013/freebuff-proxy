<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">freebuff-proxy Architecture</title>
  <desc id="arch-desc">End-to-end request flow from OpenAI clients through freebuff-proxy core modules to Codebuff free mode upstream.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13"/>
      <stop offset="100%" stop-color="#0e1520"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d28"/>
      <stop offset="100%" stop-color="#0f151e"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141d2a"/>
      <stop offset="100%" stop-color="#0b1017"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1"/>

  <!-- Architecture Header -->
  <g transform="translate(48, 30)">
    <text x="0" y="0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">SYSTEM ARCHITECTURE &amp; DATA FLOW</text>
    <text x="0" y="22" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">How freebuff-proxy turns Codebuff into an OpenAI Endpoint</text>
  </g>

  <!-- ==================== COLUMN 1: OPENAI CLIENTS ==================== -->
  <g transform="translate(48, 72)" filter="url(#shadow)">
    <!-- Container Box -->
    <rect width="216" height="318" rx="10" fill="url(#boxGrad)" stroke="#30363d" stroke-width="1.2"/>
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 206 0 C 211.523 0 216 4.477 216 10 L 216 34 L 0 34 Z" fill="#1b2332"/>
    <text x="14" y="22" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.04em">OPENAI CLIENTS</text>

    <!-- Client Card 1: pi / omp -->
    <g transform="translate(12, 44)">
      <rect width="192" height="46" rx="6" fill="#0d1117" stroke="#21262d"/>
      <circle cx="16" cy="18" r="4" fill="#58a6ff"/>
      <text x="28" y="21" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">pi / omp</text>
      <text x="28" y="37" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">AI coding harness</text>
    </g>

    <!-- Client Card 2: qwen-agent -->
    <g transform="translate(12, 98)">
      <rect width="192" height="46" rx="6" fill="#0d1117" stroke="#21262d"/>
      <circle cx="16" cy="18" r="4" fill="#bc8cff"/>
      <text x="28" y="21" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">qwen-agent</text>
      <text x="28" y="37" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">terminal &amp; web agent</text>
    </g>

    <!-- Client Card 3: cline / continue -->
    <g transform="translate(12, 152)">
      <rect width="192" height="46" rx="6" fill="#0d1117" stroke="#21262d"/>
      <circle cx="16" cy="18" r="4" fill="#3fb950"/>
      <text x="28" y="21" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">cline / continue</text>
      <text x="28" y="37" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">IDE extensions</text>
    </g>

    <!-- Client Card 4: curl / SDK -->
    <g transform="translate(12, 206)">
      <rect width="192" height="46" rx="6" fill="#0d1117" stroke="#21262d"/>
      <circle cx="16" cy="18" r="4" fill="#d29922"/>
      <text x="28" y="21" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">curl / python-sdk</text>
      <text x="28" y="37" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">custom scripts &amp; apps</text>
    </g>

    <!-- Bottom Request Pill -->
    <g transform="translate(12, 260)">
      <rect width="192" height="44" rx="6" fill="#161e2a" stroke="#30363d"/>
      <text x="10" y="18" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Standard OpenAI request:</text>
      <text x="10" y="34" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">/v1/chat/completions</text>
    </g>
  </g>

  <!-- Arrow: Clients -> Proxy -->
  <path d="M 264 231 L 314 231" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)"/>
  <text x="265" y="220" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">HTTP/SSE</text>

  <!-- ==================== COLUMN 2: PROXY CORE ==================== -->
  <g transform="translate(322, 64)" filter="url(#shadow)">
    <!-- Container Box -->
    <rect width="536" height="332" rx="12" fill="url(#coreGrad)" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 524 0 C 530.627 0 536 5.373 536 12 L 536 36 L 0 36 Z" fill="#152132"/>
    <circle cx="18" cy="18" r="4.5" fill="#58a6ff"/>
    <text x="32" y="22" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">FREEBUFF-PROXY CORE</text>
    <text x="364" y="22" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">localhost:8787/v1</text>

    <!-- Module 1 (Top-Left): Smart Cost Router -->
    <g transform="translate(14, 46)">
      <rect width="246" height="130" rx="7" fill="#0d1117" stroke="#21262d"/>
      <text x="12" y="20" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">1. Smart Cost Router</text>
      <text x="12" y="44" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Reuses open sessions (0 cost)</text>
      <text x="12" y="66" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• 'auto' picks cheapest model</text>
      <text x="12" y="88" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Dispatches to richest balance</text>
      <text x="12" y="110" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Auto cooldown on 402/403</text>
    </g>

    <!-- Module 2 (Top-Right): Multi-Account Pool -->
    <g transform="translate(276, 46)">
      <rect width="246" height="130" rx="7" fill="#0d1117" stroke="#21262d"/>
      <text x="12" y="20" fill="#bc8cff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">2. Multi-Account Pool</text>
      <text x="12" y="44" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Discovers ~/.config creds &amp; env</text>
      <text x="12" y="66" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• 25 freebucks/day per account</text>
      <text x="12" y="88" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• N accounts = N active sessions</text>
      <text x="12" y="110" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Deduped by email and token</text>
    </g>

    <!-- Module 3 (Bottom-Left): Signature & Tool Shaper -->
    <g transform="translate(14, 186)">
      <rect width="246" height="132" rx="7" fill="#0d1117" stroke="#21262d"/>
      <text x="12" y="20" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">3. Signature &amp; Tool Shaper</text>
      <text x="12" y="44" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Injects Buffy root system prompt</text>
      <text x="12" y="66" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Adds run_file_change_hooks</text>
      <text x="12" y="88" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Scrubs injected tool from stream</text>
      <text x="12" y="110" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Stable client_id per run</text>
    </g>

    <!-- Module 4 (Bottom-Right): Session & Run Engine -->
    <g transform="translate(276, 186)">
      <rect width="246" height="132" rx="7" fill="#0d1117" stroke="#21262d"/>
      <text x="12" y="20" fill="#d29922" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">4. Session &amp; Run Engine</text>
      <text x="12" y="44" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Random enhanced-… fingerprint</text>
      <text x="12" y="66" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• 1-hour session lifetime (unlimited)</text>
      <text x="12" y="88" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Reuses agent runs (START action)</text>
      <text x="12" y="110" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Adopts sessions across restarts</text>
    </g>
  </g>

  <!-- Arrow: Proxy -> Upstream -->
  <path d="M 858 231 L 906 231" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="860" y="220" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">HTTPS</text>

  <!-- ==================== COLUMN 3: CODEBUFF UPSTREAM ==================== -->
  <g transform="translate(914, 72)" filter="url(#shadow)">
    <!-- Container Box -->
    <rect width="238" height="318" rx="10" fill="url(#boxGrad)" stroke="#30363d" stroke-width="1.2"/>
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 228 0 C 233.523 0 238 4.477 238 10 L 238 34 L 0 34 Z" fill="#1b2332"/>
    <text x="14" y="22" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.04em">CODEBUFF UPSTREAM</text>

    <!-- Upstream Card 1: API Endpoint -->
    <g transform="translate(12, 44)">
      <rect width="214" height="52" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="12" y="22" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">codebuff.com API</text>
      <text x="12" y="40" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">POST /api/v1/freebuff/session</text>
    </g>

    <!-- Upstream Card 2: Agent Runs -->
    <g transform="translate(12, 106)">
      <rect width="214" height="52" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="12" y="22" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Agent Run Engine</text>
      <text x="12" y="40" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5">POST /api/v1/agent-runs</text>
    </g>

    <!-- Upstream Card 3: Free Mode Models -->
    <g transform="translate(12, 168)">
      <rect width="214" height="82" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="12" y="20" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Free Mode Models</text>
      <text x="12" y="38" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• GLM-5.3-Flash, Kimi (5fb)</text>
      <text x="12" y="56" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Mimo 2.5, Solar (10fb)</text>
      <text x="12" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• DeepSeek, Luna, Gemini…</text>
    </g>

    <!-- Bottom Badge -->
    <g transform="translate(12, 260)">
      <rect width="214" height="44" rx="6" fill="#238636" fill-opacity="0.12" stroke="#238636" stroke-opacity="0.4"/>
      <text x="16" y="20" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✓ CLI Fingerprint Verified</text>
      <text x="16" y="35" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Emulates official CLI binary</text>
    </g>
  </g>
</svg>
