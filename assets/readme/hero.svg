<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">freebuff-proxy - OpenAI-Compatible Proxy for Codebuff Free Mode</title>
  <desc id="hero-desc">OpenAI-compatible reverse proxy for Codebuff free mode with smart session routing and multi-account pooling.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13"/>
      <stop offset="100%" stop-color="#0e1622"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d28"/>
      <stop offset="100%" stop-color="#0f151e"/>
    </linearGradient>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="15.5" fill="none" stroke="#30363d" stroke-opacity="0.8"/>

  <!-- Left Column: Branding, Value Prop & Commands -->
  <g transform="translate(54, 44)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="224" height="26" rx="13" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.35"/>
    <circle cx="13" cy="13" r="4" fill="#3fb950"/>
    <text x="24" y="17" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">OPENAI-COMPATIBLE PROXY</text>

    <!-- Title -->
    <text x="0" y="76" fill="url(#brandGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.02em">freebuff-proxy</text>

    <!-- Value Statement -->
    <text x="0" y="114" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">Bridge any OpenAI client to Codebuff free mode.</text>
    <text x="0" y="138" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Zero-cost session reuse, multi-account pooling &amp; CLI emulation.</text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 166)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="132" height="26" rx="6" fill="#161e2a" stroke="#30363d"/>
      <text x="10" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">⚡ Cost Optimizer</text>

      <!-- Badge 2 -->
      <rect x="140" y="0" width="132" height="26" rx="6" fill="#161e2a" stroke="#30363d"/>
      <text x="150" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">👥 Account Pool</text>

      <!-- Badge 3 -->
      <rect x="280" y="0" width="138" height="26" rx="6" fill="#161e2a" stroke="#30363d"/>
      <text x="290" y="17" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">🛡️ Auto Fingerprint</text>
    </g>

    <!-- Quick Start Box -->
    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="418" height="66" rx="8" fill="#0d1117" stroke="#30363d"/>
      <!-- Line 1: Install -->
      <text x="14" y="26" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">$</text>
      <text x="28" y="26" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">pip install -e .</text>
      <!-- Line 2: Start -->
      <text x="14" y="50" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">$</text>
      <text x="28" y="50" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">freebuff-proxy start</text>
      <text x="210" y="50" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12"># http://127.0.0.1:8787/v1</text>
    </g>
  </g>

  <!-- Right Column: Terminal Window Proof -->
  <g transform="translate(510, 36)" filter="url(#cardShadow)">
    <rect width="636" height="308" rx="10" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>

    <!-- Window Title Bar -->
    <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 626 0 C 631.523 0 636 4.477 636 10 L 636 34 L 0 34 Z" fill="#141a24"/>
    <line x1="0" y1="34" x2="636" y2="34" stroke="#30363d" stroke-width="1"/>

    <!-- Window Buttons -->
    <circle cx="18" cy="17" r="5" fill="#f85149"/>
    <circle cx="34" cy="17" r="5" fill="#d29922"/>
    <circle cx="50" cy="17" r="5" fill="#3fb950"/>

    <text x="210" y="21" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">freebuff-proxy — 127.0.0.1:8787</text>

    <!-- Terminal Inner Content -->
    <g transform="translate(18, 48)">
      <!-- Mini Dashboard Row -->
      <rect x="0" y="0" width="600" height="28" rx="5" fill="#0d1117" stroke="#21262d"/>
      <circle cx="14" cy="14" r="3.5" fill="#3fb950"/>
      <text x="24" y="18" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">ONLINE</text>
      <text x="80" y="18" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">http://127.0.0.1:8787/v1</text>
      <text x="320" y="18" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">pool: </text>
      <text x="360" y="18" fill="#bc8cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">3 accounts</text>
      <text x="460" y="18" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">budget: </text>
      <text x="515" y="18" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">15/25 fb</text>

      <!-- Log Entries -->
      <!-- Line 1: Server Start -->
      <g transform="translate(0, 48)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        <text x="0" y="0" fill="#6e7681">01:38:02</text>
        <rect x="64" y="-12" width="62" height="17" rx="3" fill="#1f6feb" fill-opacity="0.2"/>
        <text x="70" y="0" fill="#58a6ff" font-weight="700">[server]</text>
        <text x="134" y="0" fill="#c9d1d9">listening on http://127.0.0.1:8787/v1</text>
      </g>

      <!-- Line 2: Route -->
      <g transform="translate(0, 76)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        <text x="0" y="0" fill="#6e7681">01:38:14</text>
        <rect x="64" y="-12" width="56" height="17" rx="3" fill="#bc8cff" fill-opacity="0.2"/>
        <text x="70" y="0" fill="#bc8cff" font-weight="700">[route]</text>
        <text x="128" y="0" fill="#f0f6fc">auto -&gt; z-ai/glm-5.3-flash (session hit)</text>
      </g>

      <!-- Line 3: Session -->
      <g transform="translate(0, 104)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        <text x="0" y="0" fill="#6e7681">01:38:14</text>
        <rect x="64" y="-12" width="70" height="17" rx="3" fill="#d29922" fill-opacity="0.2"/>
        <text x="70" y="0" fill="#d29922" font-weight="700">[session]</text>
        <text x="142" y="0" fill="#c9d1d9">konopnicka... reused instance (0 fb cost)</text>
      </g>

      <!-- Line 4: Run Injection -->
      <g transform="translate(0, 132)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        <text x="0" y="0" fill="#6e7681">01:38:15</text>
        <rect x="64" y="-12" width="46" height="17" rx="3" fill="#238636" fill-opacity="0.2"/>
        <text x="70" y="0" fill="#3fb950" font-weight="700">[run]</text>
        <text x="118" y="0" fill="#c9d1d9">injected Buffy root prompt &amp; signature tool</text>
      </g>

      <!-- Line 5: Summary -->
      <g transform="translate(0, 160)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        <text x="0" y="0" fill="#6e7681">01:38:16</text>
        <rect x="64" y="-12" width="76" height="17" rx="3" fill="#388bfd" fill-opacity="0.2"/>
        <text x="70" y="0" fill="#79c0ff" font-weight="700">[summary]</text>
        <text x="148" y="0" fill="#3fb950" font-weight="600">200 OK</text>
        <text x="198" y="0" fill="#8b949e">1,420 prompt + 280 compl (1.42s)</text>
      </g>

      <!-- Line 6: Cursor -->
      <g transform="translate(0, 192)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        <text x="0" y="0" fill="#3fb950" font-weight="700">❯</text>
        <text x="14" y="0" fill="#8b949e">ready for client connections...</text>
        <rect x="204" y="-10" width="7" height="13" fill="#58a6ff" fill-opacity="0.8"/>
      </g>
    </g>
  </g>
</svg>
